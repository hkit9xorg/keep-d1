<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keep D1</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="code-gate" id="codeGate" hidden>
    <form class="code-card" id="codeForm">
      <h2>Nhập code</h2>
      <p>
        Mỗi mã sẽ chứa một danh sách ghi chú riêng.
        Nhập đúng mã để xem hoặc quản lý các ghi chú tương ứng.
        Mã nên dài ít nhất 6 ký tự.
      </p>
      <input class="code-input" id="codeInput" autocomplete="off" spellcheck="false" placeholder="mysecret123" />
      <div class="code-card-actions">
        <button class="primary-button" type="submit">Mở ghi chú</button>
      </div>
    </form>
  </div>

  <main class="app" id="app" hidden>
    <header class="top-header">
      <div class="header-tools">
        <div class="code-pill" title="Code hiện tại">
          <strong id="currentCode"></strong>
        </div>
        <div class="count" id="count">0 ghi chú</div>
      </div>

      <div class="search-wrap">
        <input class="search-input" id="searchInput" type="search" placeholder="Tìm ghi chú..." autocomplete="off" />
      </div>

      <div class="composer-actions">
        <button class="ghost-button" id="cancelEditButton" type="button" hidden form="form">
          Hủy sửa
        </button>
        <button class="primary-button" id="saveButton" type="submit" form="form">
          Lưu ghi chú
        </button>
      </div>
    </header>

    <form class="composer" id="form">
      <textarea id="title" rows="1" placeholder="Nhập nội dung ghi chú..."></textarea>
      <div class="composer-image" id="imagePreview" hidden>
        <img id="imagePreviewImg" alt="Ảnh ghi chú đã paste">
        <button class="ghost-button" id="removeImageButton" type="button">Gỡ ảnh</button>
      </div>
      <p class="composer-error" id="composerError" role="alert" hidden></p>
    </form>
    <section class="notes" id="list" aria-live="polite"></section>
  </main>

  <dialog class="note-modal" id="noteModal" aria-labelledby="noteModalTitle">
    <div class="note-modal-panel">
      <div class="note-modal-header">
        <div>
          <h2 id="noteModalTitle">Ghi chú đầy đủ</h2>
          <p class="note-modal-date" id="noteModalDate"></p>
        </div>
        <button class="ghost-button" id="closeNoteModalButton" type="button">Đóng</button>
      </div>
      <img class="note-modal-image" id="noteModalImage" alt="Ảnh ghi chú" hidden>
      <div class="note-modal-text markdown-body" id="noteModalText"></div>
      <div class="note-modal-actions">
        <button class="ghost-button" id="editModalNoteButton" type="button">Sửa</button>
        <button class="ghost-button" id="copyModalNoteButton" type="button">Copy</button>
        <button class="primary-button" id="closeNoteModalFooterButton" type="button">Đóng</button>
      </div>
    </div>
  </dialog>

  <script src="app.js">
  </script>
</body>

</html>
